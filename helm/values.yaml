image:
  repository: ghcr.io/keepguard/srv-token-manager
  tag: "1.0.8"
  pullPolicy: IfNotPresent

service:
  port: 8700

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

env:
  appEnv: dev
  redisHost: "redis"
  redisPort: 6379
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: "5672"
  auditExchange: "srv-audit-exchange-prod"

imagePullSecrets:
  - name: ghcr-secret
