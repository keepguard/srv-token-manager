image:
  repository: ghcr.io/keepguard/srv-token-manager
  tag: "48f66f3"
  pullPolicy: IfNotPresent

service:
  port: 8700

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

env:
  appEnv: prod
  redisHost: "redis"
  redisPort: 6379
  rabbitmqHost: "rabbitmq-service"
  rabbitmqPort: "5672"
  auditExchange: "srv-audit-exchange-prod"

imagePullSecrets:
  - name: ghcr-secret
